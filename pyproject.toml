[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "decision-lock-agent"
version = "0.2.0"
description = "A local-first Strands agent for small decisions and one next action."
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
  "strands-agents[gemini]==1.59.0",
  "streamlit==1.65.0",
  "python-dotenv==1.2.4",
  "tzdata==2026.5",
  "httpx[socks]>=0.28.1,<1",
  "psutil>=7,<9",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.17.0"]

[tool.setuptools.packages.find]
include = ["decision_lock*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: requires an explicitly enabled live model"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
